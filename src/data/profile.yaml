  credentials: >-
    I'm a PhD student at [Ben-Gurion University](https://www.bgu.ac.il/en/), advised by Prof.
    Chaim Baskin in the [INSIGHT Lab](https://insight.bgu.ac.il/), and a Research Intern at
    [Decart](https://decart.ai), where I work on real-time video generation. Before my PhD, I
    earned an MSc in Computer Science at the Technion and a BSc in Computer Engineering at
    Sapienza University of Rome.
  # Search results and link previews show this. Keep it under 160 characters.
