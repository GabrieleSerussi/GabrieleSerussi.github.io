  # Third person, for talk introductions and for AI assistants to quote. He/him (Gabriele,
  # 2026-10-26). Don't say where he is based (his choice); naming Israel's ministry for the grant
  # is fine. Every fact is on the site with its source.
  bio:
    short: >-
      Gabriele Serussi is an AI researcher working on efficient world models and video AI. He is a
      PhD student at Ben-Gurion University of the Negev, advised by Prof. Chaim Baskin in the
      INSIGHT Lab, and a Research Intern at Decart, where he works on real-time video generation.
    long: |-
      Gabriele Serussi is an AI researcher working on efficient world models: models that understand video, generate it and act on it while spending only the compute they need. He is a PhD student in Electrical and Computer Engineering at Ben-Gurion University of the Negev, advised by Prof. Chaim Baskin in the INSIGHT Lab, and a Research Intern at Decart, where he works on real-time video generation. Before that, he was a Research Intern at the Bosch Center for Artificial Intelligence, supervised by Prof. Chaim Baskin and Dotan Di Castro, working on video retrieval and on fusing vision with radar.

      His research covers long-video understanding, generative world models and robotics. It includes HERBench (CVPR 2026), a video question answering benchmark in which every question needs at least three separate cues from the video, with more than 11,000 dataset downloads; Structured Diffusion Bridges (ICML 2026), which translate between modalities with less paired data; HiMu (WACV 2027), a training-free frame selector for long videos; VEDJE, a cached reranker for scalable video-text retrieval presented at an ICML 2026 workshop; and a drone that localizes itself from its own rotor noise (IROS 2024, oral pitch). He also co-wrote a research grant on the adversarial evaluation of generative AI, funded by Israel's Ministry of Innovation, Science and Technology.

      He holds an MSc in Computer Science from the Technion, advised by Prof. Alex Bronstein and Prof. Chaim Baskin, and a BSc in Computer Engineering from Sapienza University of Rome.

  # The research section: one lede, three pillars with the papers that back them, one thread.
  research:
    lede: >-
      A useful world model has to understand, generate and act on a budget. My work covers all
      three, and efficiency runs through it, from what a model looks at to the hardware it runs on.
    pillars:
      - kicker: Understand
        title: Long-video understanding
        text: >-
          Benchmarks that show where Video-LLMs fail, and methods that let them look at less or
          train less.
        papers: [herbench, himu, vedje, pregen]
      - kicker: Generate
        title: Generative world models
        text: >-
          Real-time video generation at Decart, and diffusion bridges that translate between
          modalities with less paired data, or none.
        papers: [sdb]
      - kicker: Act
        title: Robotics
        text: >-
          Drones that shape their own rotor noise to localize themselves, and a growing interest
          in world models for robots.
        papers: [ears]
    thread: >-
      Newest direction: memory for world models, deciding what a generator or a robot should keep
      when it cannot keep everything.
    # Topics only, very general: no questions, methods, results, venues or names (Gabriele,
    # 2026-10-26). Sources: the #closed-loop-ar-video-generation, #diffusion-distilation,
    # #capacity-transformer-gnn, #transformer-gnn and #disaggregated-inference Slack channels.
    in_progress:
      - title: Autoregressive video generation
        text: Generating long videos one chunk at a time while keeping them consistent.
      - title: Diffusion distillation
        text: Distilling diffusion models into faster generators.
      - title: Evidence aggregation in Transformers
        text: >-
          Helping Transformers combine many pieces of evidence, the failure
          [HERBench](/research/herbench/) exposed in Video-LLMs.
      - title: Disaggregated inference
        text: Serving large models efficiently across different kinds of hardware.

