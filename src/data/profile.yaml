  # The research section: one lede, three pillars with the papers that back them, one thread.
  research:
    lede: >-
      A useful world model has to understand, generate and act on a budget. My work covers all
      three, and efficiency runs through it, from what a model looks at to the hardware it runs on.
    pillars:
      - kicker: Understand
        title: Long-video understanding
        text: >-
          Benchmarks that show where Video-LLMs fail, and methods that let them look at less or
          train less.
        papers: [herbench, himu, vedje, pregen]
      - kicker: Generate
        title: Generative world models
        text: >-
          Real-time video generation at Decart, and diffusion bridges that translate between
          modalities with less paired data, or none.
        papers: [sdb]
      - kicker: Act
        title: Robotics
        text: >-
          Drones that shape their own rotor noise to localize themselves, and a growing interest
          in world models for robots.
        papers: [ears]
    thread: >-
      Newest direction: memory for world models, deciding what a generator or a robot should keep
      when it cannot keep everything.
    # Topics only, very general: no questions, methods, results, venues or names (Gabriele,
    # 2026-10-26). Sources: the #closed-loop-ar-video-generation, #diffusion-distilation,
    # #capacity-transformer-gnn, #transformer-gnn and #disaggregated-inference Slack channels.
    in_progress:
      - title: Autoregressive video generation
        text: Generating long videos one chunk at a time while keeping them consistent.
      - title: Diffusion distillation
        text: Distilling diffusion models into faster generators.
      - title: Evidence aggregation in Transformers
        text: >-
          Helping Transformers combine many pieces of evidence, the failure
          [HERBench](/research/herbench/) exposed in Video-LLMs.
      - title: Disaggregated inference
        text: Serving large models efficiently across different kinds of hardware.

