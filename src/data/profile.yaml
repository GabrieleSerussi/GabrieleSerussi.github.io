  # Paragraphs for the About section. [label](url) makes a link; #paper-<id> jumps to a paper below.
  about:
    - >-
      I'm a PhD researcher at the [INSIGHT Lab](https://insight.interia.website/) at
      Ben-Gurion University, advised by Prof. Chaim Baskin, and an AI Researcher at
      [Decart](https://decart.ai), where I work on real-time video generation.
    - >-
      My work asks how little a video model can spend and still get the answer right.
      Recent examples are [HERBench](#paper-herbench) (CVPR 2026), a benchmark showing that
      Video-LLMs break down when an answer needs evidence from across a video;
      [HiMu](#paper-himu), a training-free frame selector that matches uniform sampling with
      a quarter of the frames; and [PREGEN](#paper-pregen), composed video retrieval without
      fine-tuning the VLM.
    - >-
      Before that, I did my MSc at the Technion on acoustic localization for drones
      ([IROS 2024](#paper-ears)).
