      title={Active propulsion noise shaping for multi-rotor aircraft localization},
      url={http://dx.doi.org/10.1109/IROS58592.2024.10802115},
      DOI={10.1109/iros58592.2024.10802115},
      booktitle={2024 IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS)},
      publisher={IEEE},
      author={Serussi, Gabriele and Shor, Tamir and Hirshberg, Tom and Baskin, Chaim and Bronstein, Alex M.},
      year={2024},
      month=oct,
      pages={472--479}
    }

# arXiv 2610.11850 (v2, 2026-10-12) marks Shahaf Wagner and Gabriele Serussi as equal contributors.
- id: vedje
  title: "VEDJE: Video-Efficient Discriminative Joint Encoder for Scalable Video-Text Retrieval"
  short: VEDJE
  authors: ["Shahaf Wagner*", "Gabriele Serussi*", "Dan Ben Ami", "Tomer Galanti", "Chaim Baskin"]
  venue: "ICML 2026 Workshop (AdaptFM)"
  type: workshop
  role: "co-first author"
  theme: "efficient video understanding"
  selected: true
  emphasis: standard
  # Table 1: VEDJE 59.8 T2V R@1 on MSR-VTT with about 157M online parameters (Figure 1); LamRA, the
  # VideoChat-Flash-7B reproduction with a 7.6B base decoder, 59.7. 7.6B / 157M is about 48.
  tldr: "VEDJE matches a 7.6B-parameter multimodal LLM retriever on MSR-VTT text-to-video retrieval (59.8 against 59.7 R@1) with about 157M online parameters, roughly 48 times fewer, by encoding each video once into a compact cache read by a 33M-parameter reranker."
  keywords: ["video-text retrieval", "reranking", "cross-encoder", "video caching", "efficient retrieval", "MSR-VTT"]
  teaser_alt: "Plot of MSR-VTT text-to-video R@1 against online model parameters, with VEDJE marked at 59.8 and about 157M parameters among published systems from 63M to 7.6B."
  links:
    arxiv: "https://arxiv.org/abs/2610.11850"
    openreview: "https://openreview.net/forum?id=ZqB0Ab4juk"
  bibtex: |-
    @misc{wagner2026vedjevideoefficientdiscriminativejoint,
          title={VEDJE: Video-Efficient Discriminative Joint Encoder for Scalable Video-Text Retrieval},
          author={Shahaf Wagner and Gabriele Serussi and Dan Ben Ami and Tomer Galanti and Chaim Baskin},
          year={2026},
          eprint={2610.11850},
          archivePrefix={arXiv},
          primaryClass={cs.CV},
