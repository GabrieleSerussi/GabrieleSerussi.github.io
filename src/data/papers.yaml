  type: conference
  role: "second author"
  theme: "generative models"
  selected: true
  emphasis: lead
  # Table 2: SDB 25.2 PSNR at half the pairs, the fully paired LDDBM baseline 25.6.
  hook: "Diffusion bridges that reach near fully paired quality with half the pairs and still learn with none."
  tldr: "Structured Diffusion Bridges reach near fully paired quality in modality translation with half the paired data, 25.2 PSNR against 25.6 for a fully paired baseline on zero-shot super-resolution, and still learn with no pairs at all."
