# papers.yaml: the single source of truth for the homepage, the publications page and llms.txt.
# Order matters: selected papers appear on the homepage in this order.
# Rules: a venue goes in only once it's publicly announced. "*" marks equal contribution.
# Staging builds list every remaining TODO; production builds refuse to run until they're gone.
# Teasers are found by file name: public/media/<id>/teaser.* first, then src/assets/teasers/<id>.png.
# emphasis: "lead" = highlight card and full row, "standard" = full row with teaser,
# "brief" = one row without teaser or tldr on the homepage.
# Copy: lead with what most makes a reader want to read more, then the proof. "hook" is the
# card line for people; "tldr" is one sentence that also names the task for search engines and
# AI assistants; "keywords" feed the structured data. Every number comes from the paper.
# BibTeX entries are the official exports (CVF, arXiv, OpenReview, IEEE via Crossref).

- id: herbench
  title: "HERBench: A Benchmark for Multi-Evidence Integration in Video Question Answering"
  short: HERBench
  authors: ["Dan Ben-Ami*", "Gabriele Serussi*", "Kobi Cohen", "Chaim Baskin"]
  venue: "CVPR 2026"
  type: conference
  role: "co-first author"
  theme: "video understanding"
  selected: true
  emphasis: lead
  hook: "Each question forces a model to combine at least three cues from different parts of a video, and 13 Video-LLMs score only 31 to 42%."
  # Impact shown as a badge. Hugging Face API, 11,424 all-time downloads on 2026-10-25.
  proof: "11k+ dataset downloads"
  tldr: "HERBench forces video models to aggregate evidence: each of its 26,806 questions needs at least three separate cues from distinct parts of the video, and 13 state-of-the-art Video-LLMs reach only 31 to 42% (random is 20%)."
  keywords: ["video question answering", "VideoQA benchmark", "multi-evidence reasoning", "long video understanding", "Video-LLMs", "frame selection"]
  teaser_alt: "Two shots from the Temporal Shot Ordering example in the HERBench project video, a spaceship in space and the Statue of Liberty at dawn or dusk, each captioned with the shot description the question lists."
  links:
    paper: "https://openaccess.thecvf.com/content/CVPR2026/papers/Ami_HERBench_A_Benchmark_for_Multi-Evidence_Integration_in_Video_Question_Answering_CVPR_2026_paper.pdf"
    arxiv: "https://arxiv.org/abs/2512.14870"
    project: "https://gabrieleserussi.github.io/HERBench/"
    code: "https://github.com/DanBenAmi/HERBench"
    dataset: "https://huggingface.co/datasets/DanBenAmi/HERBench"
  bibtex: |-
    @InProceedings{Ben_Ami_2026_CVPR,
        author    = {Ben Ami, Dan and Serussi, Gabriele and Cohen, Kobi and Baskin, Chaim},
        title     = {HERBench: A Benchmark for Multi-Evidence Integration in Video Question Answering},
        booktitle = {Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)},
        month     = {June},
        year      = {2026},
        pages     = {4505-4514}
    }

- id: sdb
