- id: ears
  title: "Active propulsion noise shaping for multi-rotor aircraft localization"
  short: Rotor-noise localization
  authors: ["Gabriele Serussi*", "Tamir Shor*", "Tom Hirshberg", "Chaim Baskin", "Alex M. Bronstein"]
  venue: "IROS 2024"
  presentation: "Oral pitch"
  also_presented: "ICML 2024 Workshop (AI4Science)"
  type: conference
  role: "co-first author"
  theme: "robotics and acoustics"
  selected: true
  emphasis: lead
  # Results: learned phases beat the best handcrafted modulation by over 2.7 times, in simulation
  # fitted to real rotor recordings.
  hook: "A drone that localizes itself by listening to its own rotor noise, which it learns to shape."
  tldr: "Learning a drone's rotor phases together with a neural localizer lets it localize itself from its own propulsion noise, more than 2.7 times better in simulation than the best handcrafted modulation."
  keywords: ["drone localization", "acoustic localization", "multi-rotor aircraft", "propulsion noise", "rotor phase modulation", "robotics"]
  teaser_alt: "Simulated sound pressure around a four-rotor drone in a square room, with positive pressure in red and negative in blue."
  links:
    paper: "https://doi.org/10.1109/IROS58592.2024.10802115"
    arxiv: "https://arxiv.org/abs/2402.17289"
    code: "https://github.com/tamirshor7/EARS_code"
  bibtex: |-
