# Accepted at WACV 2027 (Gabriele, 2026-10-25). The arXiv version does not mention it yet.
- id: himu
  title: "HiMu: Hierarchical Multimodal Frame Selection for Long Video Question Answering"
  short: HiMu
  authors: ["Dan Ben-Ami", "Gabriele Serussi", "Kobi Cohen", "Chaim Baskin"]
  venue: "WACV 2027"
  type: conference
  role: "second author"
  theme: "efficient video understanding"
  selected: true
  emphasis: lead
  # Section 4.3: with K=16 frames HiMu reaches 73.2% on Video-MME (Qwen3-VL-8B), uniform with K=64 71.7%.
  hook: "Picks 16 frames that beat 64 uniformly sampled ones on Video-MME, without any training."
  tldr: "With 16 frames chosen by HiMu, a training-free frame selector for long-video question answering, Qwen3-VL-8B scores 73.2% on Video-MME, above its 71.7% with 64 uniformly sampled frames."
  keywords: ["frame selection", "long video question answering", "multimodal large language models", "training-free", "neuro-symbolic reasoning", "audio-visual"]
  teaser_alt: "Score curves from several experts over a basketball broadcast, combined into one satisfaction curve that picks four frames."
