name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild so old news drops off even when nothing else changes.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set the repository variable SITE_STAGE to "production" at launch.
      SITE_STAGE: ${{ vars.SITE_STAGE || 'staging' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # After a production deploy, tell IndexNow (Bing, which ChatGPT search and Copilot use, plus
    # Yandex, Seznam and Naver) that every page in the sitemap may have changed. The key file is
    # public/b7c1e068eff044305c294cdec2d63961.txt; IndexNow keys are public by design.
    if: github.event_name != 'schedule' && vars.SITE_STAGE == 'production'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow
        env:
          SITE: https://gabrieleserussi.github.io
          KEY: b7c1e068eff044305c294cdec2d63961
        run: |
          sleep 30
          curl -fsSL "$SITE/sitemap-0.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' > urls.txt
          python3 -c 'import json, os; urls = open("urls.txt").read().split(); site = os.environ["SITE"]; print(json.dumps({"host": site.split("//")[1], "key": os.environ["KEY"], "keyLocation": site + "/" + os.environ["KEY"] + ".txt", "urlList": urls}))' > body.json
          code=$(curl -s -o response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow answered $code for $(wc -l < urls.txt) URLs"; cat response.txt
          case "$code" in 200|202) ;; *) exit 1 ;; esac
